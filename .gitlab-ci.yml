stages:
  - test
  - build

client_lint:
  stage: test
  image: node:22
  script:
    - cd client
    - npm install
    - npm run lint

client_build:
  stage: build
  image: node:22
  script:
    - cd client
    - npm install
    - npm run build

server_check:
  stage: test
  image: node:22
  script:
    - cd server
    - npm install
